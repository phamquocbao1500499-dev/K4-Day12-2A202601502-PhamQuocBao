services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_TOKEN: ${API_TOKEN}
      REDIS_URL: redis://redis:6379/0
      BUCKET_CAPACITY: 10
      REFILL_PER_MINUTE: 10
      DAILY_BUDGET_USD: 1.0
      LOG_LEVEL: INFO
      PORT: 8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis-data: